[project]
name = "orbit-mac"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["shared", "services/task", "services/voice", "services/decision", "services/automation", "services/research", "services/room"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
