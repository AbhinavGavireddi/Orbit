name: orbit-prod

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp:size=128m]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [backend]
  stop_grace_period: 20s
  mem_limit: 1024m
  cpus: 1.5

x-auth: &auth
  ORBIT_DEVICE_TOKEN: ${ORBIT_DEVICE_TOKEN:?set ORBIT_DEVICE_TOKEN}
  ORBIT_SERVICE_TOKEN: ${ORBIT_SERVICE_TOKEN:?set ORBIT_SERVICE_TOKEN}
  REDIS_URL: redis://redis:6379/0
  ORBIT_TASK_URL: http://task:8100
  ORBIT_ARTIFACT_DIR: /data/artifacts

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    networks: [backend]
    ports:
      - 80:80
      - 443:443
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      ORBIT_TASK_HOST: ${ORBIT_TASK_HOST:?set ORBIT_TASK_HOST}
      ORBIT_VOICE_HOST: ${ORBIT_VOICE_HOST:?set ORBIT_VOICE_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      task: {condition: service_healthy}
      voice: {condition: service_healthy}

  redis:
    image: redis:7.4.6-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, "${REDIS_MAXMEMORY:-1gb}", --maxmemory-policy, noeviction]
    networks: [backend]
    volumes: [redis-data:/data]
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 20

  task:
    <<: *runtime
    image: ${ORBIT_REGISTRY:?set ORBIT_REGISTRY}/orbit-task:${ORBIT_IMAGE_TAG:?set ORBIT_IMAGE_TAG}
    environment:
      <<: *auth
      ORBIT_SERVICE: task
      ORBIT_BIND_HOST: 0.0.0.0
      ORBIT_PORT: "8100"
      ORBIT_DECISION_URL: http://decision:8104
      ORBIT_ROOM_URL: http://room:8105
      ORBIT_BROWSER_HOSTS: ${ORBIT_BROWSER_HOSTS:-}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes: [artifacts:/data/artifacts]
    tmpfs: [/tmp:size=256m]
    shm_size: 256mb
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      redis: {condition: service_healthy}
      room: {condition: service_healthy}

  room:
    <<: *runtime
    image: ${ORBIT_REGISTRY:?set ORBIT_REGISTRY}/orbit-room:${ORBIT_IMAGE_TAG:?set ORBIT_IMAGE_TAG}
    environment:
      <<: *auth
      ORBIT_SERVICE: room
      ORBIT_BIND_HOST: 0.0.0.0
      ORBIT_PORT: "8105"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8105/readyz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  decision:
    <<: *runtime
    image: ${ORBIT_REGISTRY:?set ORBIT_REGISTRY}/orbit-decision:${ORBIT_IMAGE_TAG:?set ORBIT_IMAGE_TAG}
    environment:
      <<: *auth
      ORBIT_SERVICE: decision
      ORBIT_BIND_HOST: 0.0.0.0
      ORBIT_PORT: "8104"
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      ORBIT_JEV_MODEL: ${ORBIT_JEV_MODEL:-jev-1.13.0}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8104/readyz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      task: {condition: service_healthy}

  voice:
    <<: *runtime
    image: ${ORBIT_REGISTRY:?set ORBIT_REGISTRY}/orbit-voice:${ORBIT_IMAGE_TAG:?set ORBIT_IMAGE_TAG}
    environment:
      <<: *auth
      ORBIT_SERVICE: voice
      ORBIT_BIND_HOST: 0.0.0.0
      ORBIT_PORT: "8101"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      ORBIT_REALTIME_MODEL: ${ORBIT_REALTIME_MODEL:-gpt-realtime-2.1-mini}
      ORBIT_TRANSCRIBE_MODEL: ${ORBIT_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      ORBIT_JEV_MODEL: ${ORBIT_JEV_MODEL:-jev-1.13.0}
      ORBIT_JEV_MODE: ${ORBIT_JEV_MODE:-shadow}
      ORBIT_JEV_CAPABILITIES: ${ORBIT_JEV_CAPABILITIES:-}
      ORBIT_VAD_EAGERNESS: ${ORBIT_VAD_EAGERNESS:-medium}
      ORBIT_DECISION_URL: http://decision:8104
      ORBIT_SKILL_ROOTS: ""
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/readyz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      task: {condition: service_healthy}
      decision: {condition: service_healthy}

  automation:
    <<: *runtime
    image: ${ORBIT_REGISTRY:?set ORBIT_REGISTRY}/orbit-automation:${ORBIT_IMAGE_TAG:?set ORBIT_IMAGE_TAG}
    environment:
      <<: *auth
      ORBIT_SERVICE: automation
      ORBIT_BIND_HOST: 0.0.0.0
      ORBIT_PORT: "8102"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      ORBIT_AGENT_MODEL: ${ORBIT_AGENT_MODEL:-gpt-5.6-sol}
      ORBIT_MAX_TASK_STEPS: ${ORBIT_MAX_TASK_STEPS:-30}
      ORBIT_DECISION_URL: http://decision:8104
      ORBIT_SKILL_ROOTS: ""
      ORBIT_LEARNED_SKILLS_DIR: ""
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/readyz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      task: {condition: service_healthy}
      decision: {condition: service_healthy}

  research:
    <<: *runtime
    image: ${ORBIT_REGISTRY:?set ORBIT_REGISTRY}/orbit-research:${ORBIT_IMAGE_TAG:?set ORBIT_IMAGE_TAG}
    environment:
      <<: *auth
      ORBIT_SERVICE: research
      ORBIT_BIND_HOST: 0.0.0.0
      ORBIT_PORT: "8103"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      ORBIT_AGENT_MODEL: ${ORBIT_AGENT_MODEL:-gpt-5.6-sol}
    volumes: [artifacts:/data/artifacts]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/readyz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      task: {condition: service_healthy}

volumes:
  redis-data:
  artifacts:
  caddy-data:
  caddy-config:

networks:
  backend:
    driver: bridge
