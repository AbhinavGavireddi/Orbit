name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Whitespace check
        run: git diff --check
      - name: Ruff
        run: uv run ruff check shared services tests scripts
      - name: Pytest
        run: uv run pytest -q
      - name: Release hygiene
        run: uv run python scripts/check_release.py

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service images
        run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --load

  native:
    name: Native build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bash native/check.sh
