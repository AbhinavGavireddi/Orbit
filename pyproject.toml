[project]
name = "orbit"
version = "0.1.0"
description = "Orbit voice-first personal assistant"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "redis==8.1.0",
    "pydantic-settings==2.15.0",
    "websockets==17.1",
    "python-dotenv==1.1.1",
    "playwright==1.55.0",
    "langgraph==1.2.2",
    "reportlab==5.0.1",
    "pypdf==6.19.0",
    "pyyaml==6.0.2",
    "openai==3.24.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fakeredis[lua]==2.38.0",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "shared",
    "services/task",
    "services/voice",
    "services/decision",
    "services/automation",
    "services/research",
    "services/room",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
